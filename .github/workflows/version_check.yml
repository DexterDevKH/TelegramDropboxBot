name: iOS App Store Version Check & Alert Daemon

on:
  schedule:
    # Run every 4 hours automatically
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: ios-version-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-versions:
    name: Check YouTube & YouTube Music iOS Versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore iOS Version State Cache
        uses: actions/cache@v4
        with:
          path: .ios_versions_cache.json
          key: ios-versions-cache-${{ github.run_id }}
          restore-keys: |
            ios-versions-cache-

      - name: Run iOS Version Monitor & Alert Service
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AUTHORIZED_USER_IDS: ${{ secrets.AUTHORIZED_USER_IDS }}
        run: |
          python bot.py --check-versions
