name: Pre-Build Native Core Engine

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  prebuild:
    name: Build & Cache Native Engine Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache Action
        uses: Swatinem/rust-cache@v2

      - name: Compile Native Core Engine
        run: |
          echo "::group::📦 Compiling High-Performance Native Core Engine"
          cargo build --release
          echo "::endgroup::"

      - name: Verify Binary
        run: |
          chmod +x target/release/telegram_dropbox_bot
          ./target/release/telegram_dropbox_bot --help

      - name: Save Engine Binary to Cache
        uses: actions/cache/save@v4
        with:
          path: target/release/telegram_dropbox_bot
          key: engine-bin-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**') }}
