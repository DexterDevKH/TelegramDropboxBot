name: Telegram to Dropbox Sync Pipeline

on:
  repository_dispatch:
    types: [telegram_sync, track_build]
  workflow_dispatch:
    inputs:
      retention_cap:
        description: 'Dropbox folder FIFO retention cap (number of files)'
        required: false
        default: '2'
      privacy_mode:
        description: 'Mask filenames, user IDs, and cloud paths in workflow logs'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      log_level:
        description: 'Logging verbosity level'
        required: false
        default: 'INFO'
        type: choice
        options:
          - 'INFO'
          - 'DEBUG'
          - 'WARNING'

concurrency:
  group: tg-dropbox-sync-${{ github.event.client_payload.message_id || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  sync-service:
    name: Run Cloud Sync Engine
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Restore Pre-Built Engine Binary
        id: binary-cache
        uses: actions/cache@v4
        with:
          path: target/release/telegram_dropbox_bot
          key: engine-bin-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**') }}
          restore-keys: |
            engine-bin-${{ runner.os }}-

      - name: Check Binary Status
        id: check-bin
        run: |
          if [ -f target/release/telegram_dropbox_bot ]; then
            chmod +x target/release/telegram_dropbox_bot
            if ./target/release/telegram_dropbox_bot --help >/dev/null 2>&1; then
              echo "ready=true" >> $GITHUB_OUTPUT
              echo "✔ Pre-built binary verified and ready to execute."
            else
              echo "ready=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Rust Toolchain
        if: steps.check-bin.outputs.ready != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache Action
        if: steps.check-bin.outputs.ready != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Compile Native Core Engine
        if: steps.check-bin.outputs.ready != 'true'
        run: |
          echo "::group::📦 Compiling High-Performance Native Core Engine"
          cargo build --release
          echo "::endgroup::"

      - name: Ensure Engine Binary Executable
        run: chmod +x target/release/telegram_dropbox_bot

      - name: Setup MTProto Engine (Telethon)
        run: |
          pip install --no-cache-dir telethon

      - name: Pre-Flight Secrets & Privacy Shield Audit
        shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          DBX_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DBX_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DBX_REFRESH: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DBX_ACCESS: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          DBX_IPA_FOLDER: ${{ secrets.DROPBOX_IPA_FOLDER || secrets.DROPBOX_TARGET_FOLDER }}
          DBX_DEB_FOLDER: ${{ secrets.DROPBOX_DEB_FOLDER }}
          AUTH_IDS: ${{ secrets.AUTHORIZED_USER_IDS }}
        run: |
          echo "::group::🔍 Auditing Secrets & Registering Privacy Masks"

          # Dynamically register masks for all custom sensitive parameters
          if [ -n "$DBX_IPA_FOLDER" ]; then
            echo "::add-mask::$DBX_IPA_FOLDER"
          fi
          if [ -n "$DBX_DEB_FOLDER" ]; then
            echo "::add-mask::$DBX_DEB_FOLDER"
          fi
          if [ -n "$TG_API_ID" ]; then
            echo "::add-mask::$TG_API_ID"
          fi
          if [ -n "$AUTH_IDS" ]; then
            echo "::add-mask::$AUTH_IDS"
            IFS=',' read -ra ADDR <<< "$AUTH_IDS"
            for id in "${ADDR[@]}"; do
              trimmed=$(echo "$id" | xargs)
              if [ -n "$trimmed" ]; then
                echo "::add-mask::$trimmed"
              fi
            done
          fi

          MISSING=0
          check_secret() {
            NAME="$1"
            VAL="$2"
            if [ -z "$VAL" ]; then
              echo "::error::Missing required GitHub Secret: $NAME"
              MISSING=1
            else
              echo "  ✔ Secret verified: $NAME"
            fi
          }

          check_secret "TELEGRAM_BOT_TOKEN" "$TG_BOT_TOKEN"
          check_secret "TELEGRAM_API_ID" "$TG_API_ID"
          check_secret "TELEGRAM_API_HASH" "$TG_API_HASH"

          if [ "${{ github.event.action }}" != "track_build" ]; then
            if [ -z "$DBX_REFRESH" ] && [ -z "$DBX_ACCESS" ]; then
              echo "::error::Missing Dropbox Token: Either DROPBOX_REFRESH_TOKEN or DROPBOX_ACCESS_TOKEN must be configured."
              MISSING=1
            else
              echo "  ✔ Dropbox authentication token verified"
            fi
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "❌ Pre-flight check failed! Please configure missing secrets in: Repository Settings ➔ Secrets and variables ➔ Actions"
            exit 1
          fi
          echo "✅ All required authentication credentials verified."
          echo "🛡️ Privacy masks registered successfully."
          echo "::endgroup::"

      - name: Publish Pipeline Deployment Summary
        shell: bash
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # ⚡ Telegram to Dropbox Sync Pipeline (v3.1.0 Native Rust Core)

          ### 🛰️ Runner Specifications & Status
          | Property | Value |
          | :--- | :--- |
          | **Host Platform** | Ubuntu Linux (`ubuntu-latest`) |
          | **Engine Runtime** | Native Rust Core (v3.1.0) via Cargo, Reqwest, Zip & Libsodium |
          | **Trigger Source** | `${{ github.event_name }}` |
          | **Concurrency Policy** | Queue per message (`cancel-in-progress: false`) |
          | **Privacy Shield** | 🛡️ Active (Filenames & user identities masked) |

          ### ⚙️ Engine Parameters
          | Parameter | Configured Value | Description |
          | :--- | :--- | :--- |
          | **IPA Vault** | `[CONFIGURED IN SECRETS]` | Destination Dropbox folder for IPAs (masked) |
          | **DEB Vault** | `[CONFIGURED IN SECRETS]` | Destination Dropbox folder for DEBs (masked) |
          | **Retention Cap** | `${{ github.event.inputs.retention_cap || '2' }} files` | FIFO auto-rotation policy per folder |
          | **Chunk Size** | `8 MB` | Streaming session upload chunk size |
          | **Direct Copy API** | `Telegram Bot API v7.0+` | Native one-tap clipboard copy buttons |

          > 💡 **Active Service:** The native Rust core is now executing ingestion and streaming chunked upload to Dropbox.
          EOF

      - name: Launch Cloud Sync / Build Tracker Daemon
        env:
          PYTHONUNBUFFERED: "1"
          PRIVACY_MODE: ${{ github.event.inputs.privacy_mode || 'true' }}
          EVENT_ACTION: ${{ github.event.action }}
          TARGET_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          TARGET_MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          DISPATCH_MESSAGE_ID: ${{ github.event.client_payload.dispatch_message_id }}
          BUILD_TARGET_KEY: ${{ github.event.client_payload.target_key }}
          BUILD_RUN_ID: ${{ github.event.client_payload.run_id }}
          BUILD_START_TIME: ${{ github.event.client_payload.start_time }}
          DOWNLOAD_URL: ${{ github.event.client_payload.download_url }}
          IS_ARTIFACT: ${{ github.event.client_payload.is_artifact }}
          ARTIFACT_ID: ${{ github.event.client_payload.artifact_id }}
          ARTIFACT_REPO: ${{ github.event.client_payload.artifact_repo }}
          FILE_NAME: ${{ github.event.client_payload.file_name }}
          FILE_SIZE: ${{ github.event.client_payload.file_size }}
          TELEGRAM_FILE_ID: ${{ github.event.client_payload.telegram_file_id }}
          IDLE_KEEP_ALIVE_SECONDS: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          AUTHORIZED_USER_IDS: ${{ secrets.AUTHORIZED_USER_IDS }}
          DROPBOX_IPA_FOLDER: ${{ secrets.DROPBOX_IPA_FOLDER || secrets.DROPBOX_TARGET_FOLDER || '/IPA' }}
          DROPBOX_TARGET_FOLDER: ${{ secrets.DROPBOX_IPA_FOLDER || secrets.DROPBOX_TARGET_FOLDER || '/IPA' }}
          DROPBOX_DEB_FOLDER: ${{ secrets.DROPBOX_DEB_FOLDER || '/DEB' }}
          MAX_FILES_IN_FOLDER: ${{ github.event.inputs.retention_cap || secrets.MAX_FILES_IN_FOLDER || '2' }}
          MAX_FILES_IN_DEB_FOLDER: ${{ secrets.MAX_FILES_IN_DEB_FOLDER }}
          CHUNK_SIZE_MB: "8"
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          ./target/release/telegram_dropbox_bot

