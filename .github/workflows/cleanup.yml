name: Auto-Purge Completed Workflow Runs

on:
  workflow_run:
    workflows:
      - "Telegram to Dropbox Sync Pipeline"
      - "Pre-Build Native Core Engine"
      - "iOS App Store Version Check & Alert Daemon"
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: auto-purge-runs
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  purge-runs:
    name: Auto-Purge Run Logs & History (Keep 1)
    runs-on: ubuntu-latest
    steps:
      - name: Purge Completed Workflow Runs (Retain 1 Per Workflow)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_NO_PROMPT: "1"
        run: |
          echo "::group::🧹 Auto-Purge: Retain 1 Most Recent Run Per Workflow"

          # Discover all workflows or fallback to known list
          WORKFLOW_PATHS=$(gh workflow list --repo "${{ github.repository }}" --json path -q '.[].path' 2>/dev/null || true)
          if [ -z "$WORKFLOW_PATHS" ]; then
            echo "Falling back to predefined workflow list..."
            WORKFLOW_PATHS="bot.yml cleanup.yml prebuild.yml version_check.yml"
          fi

          for p in $WORKFLOW_PATHS; do
            wf=$(basename "$p")
            echo "--- Processing workflow: $wf ---"

            # List completed runs ordered newest to oldest. If length > 1, extract database IDs starting from index 1 (skipping index 0 to keep the latest run).
            RUNS_TO_DELETE=$(gh run list --repo "${{ github.repository }}" --workflow="$wf" --status=completed --limit 200 --json databaseId -q 'if length > 1 then .[1:][].databaseId else empty end' 2>/dev/null || true)

            if [ -z "$RUNS_TO_DELETE" ]; then
              echo "✔ Keeping latest run (1 or 0 completed runs present)."
            else
              COUNT=$(echo "$RUNS_TO_DELETE" | wc -w)
              echo "Found $COUNT older completed run(s) to purge. Keeping the single most recent run."
              for rid in $RUNS_TO_DELETE; do
                if [ -n "$rid" ] && [ "$rid" != "${{ github.run_id }}" ]; then
                  echo "Deleting old run $rid..."
                  gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$rid" >/dev/null 2>&1 || true
                fi
              done
              echo "✔ Successfully purged $COUNT older run(s) for $wf."
            fi
          done

          echo ""
          echo "✔ Completed: Exactly one most recent run retained for each workflow."
          echo "::endgroup::"
