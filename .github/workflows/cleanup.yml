name: Auto-Purge Completed Workflow Runs

on:
  workflow_run:
    workflows: ["Telegram to Dropbox Sync Pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  purge-runs:
    name: Auto-Purge Run Logs & History
    runs-on: ubuntu-latest
    steps:
      - name: Purge Completed Workflow Runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_NO_PROMPT: "1"
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "::group::🧹 Auto-Purging Completed Sync Pipeline Run"
          # If triggered by workflow_run, target the completed run ID directly
          if [ -n "$TARGET_RUN_ID" ]; then
            echo "Deleting completed pipeline run: $TARGET_RUN_ID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$TARGET_RUN_ID" || true
          fi

          # Purge any remaining completed runs of bot.yml
          echo "Purging all completed runs of bot.yml..."
          gh run list --repo "${{ github.repository }}" --workflow=bot.yml --status=completed --json databaseId -q '.[].databaseId' | while read -r rid; do
            if [ -n "$rid" ]; then
              echo "Deleting completed bot.yml run $rid"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$rid" || true
            fi
          done

          # Purge past completed runs of this cleanup workflow itself
          echo "Purging past completed runs of cleanup.yml..."
          CURRENT_RUN="${{ github.run_id }}"
          gh run list --repo "${{ github.repository }}" --workflow=cleanup.yml --status=completed --json databaseId -q '.[].databaseId' | while read -r crid; do
            if [ -n "$crid" ] && [ "$crid" != "$CURRENT_RUN" ]; then
              echo "Deleting old cleanup run $crid"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$crid" || true
            fi
          done

          echo "✔ Complete: All completed run logs and history have been purged."
          echo "::endgroup::"
