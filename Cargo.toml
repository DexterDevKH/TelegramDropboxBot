[package]
name = "telegram_dropbox_bot"
version = "3.1.0"
edition = "2021"
authors = ["DexterDevKH"]
description = "High-performance native Rust core for Telegram to Dropbox Cloud Sync, iOS IPA builder & version monitor"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
plist = "1.7"
crypto_box = { version = "0.9", features = ["seal"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3.17"
url = "2.5"
