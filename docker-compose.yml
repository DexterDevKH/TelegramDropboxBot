version: '3.8'

services:
  # Primary Service: Lightweight Webhook Dispatcher
  # Intercepts Telegram uploads, replies instantly, and triggers GitHub Actions on-demand
  webhook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-dropbox-webhook
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    command: ["python", "webhook/server.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional Tunnel: Expose your local webhook to the internet via Cloudflare Tunnel
  # No router port forwarding or public static IP required!
  # Run with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tg-webhook-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      - webhook

  # Alternative Service: Run full bot in 24/7 daemon mode directly inside Docker (optional)
  # Run with: docker compose --profile bot up -d
  bot-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-dropbox-bot-daemon
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "bot.py"]
    profiles:
      - bot
