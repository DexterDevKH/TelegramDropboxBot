name = "telegram-dropbox-sync-trigger"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
GH_REPO = "DexterDevKH/TelegramDropboxBot"

# Note: Sensitive secrets (GH_PAT, TELEGRAM_BOT_TOKEN, AUTHORIZED_USER_IDS)
# should be added via:
#   npx wrangler secret put GH_PAT
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put AUTHORIZED_USER_IDS
# or configured directly in the Cloudflare Dashboard under:
#   Worker -> Settings -> Variables and Secrets
